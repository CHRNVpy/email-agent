[project]
name = "email-agent"
version = "1.0.0"
description = "Multi-agent AI assistant that works through email: LangGraph + Gemini/Grok over Gmail, Drive, Sheets, SQL and a RAG knowledge base."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "markdown>=3.6",
    # Google APIs
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-genai>=1.20",
    "gspread>=6.1",
    # LLM orchestration
    "langchain-core>=0.3.70",
    "langgraph>=0.6,<0.7",
    "langchain-google-genai>=2.1,<3",
    "langchain-openai>=0.3",
    # Knowledge base & market data
    "qdrant-client>=1.12",
    "yfinance>=0.2.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::PendingDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning",
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
